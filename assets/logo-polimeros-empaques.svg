<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Logo de Polímeros y Empaques</title>
  <desc id="desc">Planeta azul rodeado por un anillo celeste.</desc>
  <defs>
    <radialGradient id="planet" cx="32%" cy="25%" r="78%">
      <stop offset="0" stop-color="#e7f7ff"/>
      <stop offset="0.28" stop-color="#77c8ff"/>
      <stop offset="0.66" stop-color="#268bde"/>
      <stop offset="1" stop-color="#0b4f9c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f1ff"/>
      <stop offset="0.48" stop-color="#77c8ff"/>
      <stop offset="1" stop-color="#268bde"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#071b33" flood-opacity="0.25"/>
    </filter>
    <clipPath id="front-half"><path d="M80 570h1040v360H80z"/></clipPath>
  </defs>
  <g filter="url(#shadow)" transform="rotate(-16 600 600)">
    <ellipse cx="600" cy="600" rx="490" ry="175" fill="none" stroke="url(#ring)" stroke-width="72"/>
  </g>
  <circle cx="600" cy="600" r="285" fill="url(#planet)"/>
  <path d="M435 426c68-89 194-128 306-85-123 14-210 77-274 176-23-24-34-54-32-91z" fill="#fff" opacity="0.2"/>
  <g clip-path="url(#front-half)" transform="rotate(-16 600 600)">
    <ellipse cx="600" cy="600" rx="490" ry="175" fill="none" stroke="url(#ring)" stroke-width="72"/>
  </g>
  <circle cx="980" cy="365" r="25" fill="#d8f1ff"/>
</svg>
